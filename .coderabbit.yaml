# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US
tone_instructions: >-
  Be direct; skip praise and preamble. These are Unraid Community Applications
  templates. Prioritize correct port/path mappings and avoiding collisions
  with common apps over style.
early_access: false
enable_free_tier: true

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true

  slop_detection:
    enabled: true
    label: slop

  path_filters:
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/node_modules/**"
    - "!**/*.lock"
    - "!**/vendor/**"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "**/*.xml"
      instructions: >-
        These templates are applied directly to users' servers, so a wrong
        mapping silently misconfigures a real machine.

        Check host port defaults against ports commonly taken by other popular
        Unraid apps. A default that collides — for example the port the *arr
        media apps already use — will fail for a large share of users, and
        should be called out explicitly.

        Verify every host path is a sensible Unraid convention path, that
        writable paths are actually writable, and that no template ships a
        hardcoded credential, token, or personal path.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_usernames:
      - dependabot
      - dependabot[bot]

  tools:
    gitleaks:
      enabled: true
    languagetool:
      enabled: false

chat:
  art: false
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
